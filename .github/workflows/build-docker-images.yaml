name: Build Docker images
on:
  push:
    tags:
      - v*

env:
  DOCKER_BUILD_SUMMARY: false
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  go-prepare-env:
    name: Prepare Go environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Go environment
        uses: ./.github/actions/prepare-go-environment

  go-lint:
    name: Lint Go code
    needs: go-prepare-env
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Go environment
        uses: ./.github/actions/prepare-go-environment
      - name: Run golangci-lint
        run: make lint

  go-test:
    name: Run Go tests
    needs: go-prepare-env
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Go environment
        uses: ./.github/actions/prepare-go-environment
      - name: Run tests
        run: make test

  go-arch:
    name: Validate Go architecture
    needs: go-prepare-env
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Go environment
        uses: ./.github/actions/prepare-go-environment
      - name: Run go-cleanarch
        run: make arch

  go-build-image:
    name: Build Go images
    needs: go-prepare-env
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - application: user-service
            image-file: user-service.image.tar
          - application: user-profile-service
            image-file: user-profile-service.image.tar
          - application: message-handler-worker
            image-file: message-handler-worker.image.tar
          - application: idk-cleaner-task
            image-file: idk-cleaner-task.image.tar
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Go environment
        uses: ./.github/actions/prepare-go-environment
      - name: Build application
        run: make bin/${{ matrix.application }}
      - name: Setup Docker builder
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          file: docker/${{ matrix.application }}/Dockerfile
          context: .
          outputs: type=docker,dest=docker/${{ matrix.image-file }}
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.image-file }}
          path: docker/${{ matrix.image-file }}

  docker-push:
    name: Push Docker images
    needs:
      - go-arch
      - go-lint
      - go-test
      - go-build-image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: klwxsrx/go-service-template-user-service
            file: user-service.image.tar
          - target: klwxsrx/go-service-template-user-profile-service
            file: user-profile-service.image.tar
          - target: klwxsrx/go-service-template-message-handler-worker
            file: message-handler-worker.image.tar
          - target: klwxsrx/go-service-template-idk-cleaner-task
            file: idk-cleaner-task.image.tar
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: /tmp
      - name: Import Docker image
        run: docker image import /tmp/${{ matrix.file }} ghcr.io/${{ matrix.target }}:${{ github.ref_name }}
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push Docker image
        run: docker push ghcr.io/${{ matrix.target }}:${{ github.ref_name }}
